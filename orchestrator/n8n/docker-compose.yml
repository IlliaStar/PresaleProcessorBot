version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - '5678:5678'
    env_file:
      - .env
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_BASE_URL:-http://localhost:5678}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Kiev}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_SECURE_COOKIE=false
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - N8N_ENV_VARS_UI_ALLOWED=SHAREPOINT_SITE_URL,SHAREPOINT_TRANSCRIPTS_URL,SHAREPOINT_DRIVE_ID,SHAREPOINT_CONVERSATIONS_LIST_ID,SHAREPOINT_TURNS_LIST_ID
    extra_hosts:
      - "login.microsoftonline.com:40.126.31.71"
      - "graph.microsoft.com:20.190.190.99"
      - "t8lxc.sharepoint.com:13.107.136.10"
    volumes:
      - n8n_data:/home/node/.n8n

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  n8n_data:
  qdrant_data:
